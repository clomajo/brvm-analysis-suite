name: BRVM Analysis Suite V25.0 - Mistral AI

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  brvm-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: 🔥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Installation dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🌐 Installation Chrome/Chromedriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          CHROME_MAJOR_VERSION=$(echo $CHROME_VERSION | cut -d. -f1)
          
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}.0/linux64/chromedriver-linux64.zip" -O chromedriver.zip || \
          wget -q "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_MAJOR_VERSION}" -O version.txt && \
          CHROMEDRIVER_VERSION=$(cat version.txt) && \
          wget -q "https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip" -O chromedriver.zip
          
          unzip -q chromedriver.zip
          if [ -d "chromedriver-linux64" ]; then
            sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          else
            sudo mv chromedriver /usr/local/bin/
          fi
          sudo chmod +x /usr/local/bin/chromedriver
          
          rm -rf chromedriver-linux64 chromedriver.zip version.txt google-chrome-stable_current_amd64.deb
          
          echo "✅ Chrome: $(google-chrome --version)"
          echo "✅ Chromedriver: $(chromedriver --version)"
      
      - name: 📊 ÉTAPE 1 - Collecte Données (Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🚀 Collecte données BRVM..."
          python data_collector_simple.py
          echo "✅ Collecte terminée"
      
      - name: 📈 ÉTAPE 2 - Analyse Technique (Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🚀 Analyse technique..."
          python technical_analyzer_simple.py
          echo "✅ Analyse technique terminée"
      
      - name: 🏆 ÉTAPE 3 - Opportunity Scorer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🚀 Calcul des scores d'opportunités..."
          python opportunity_scorer_simple.py
          echo "✅ Scores mis à jour"
      
      - name: 🔮 ÉTAPE 4 - Prédictions
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          echo "🚀 Prédictions 20 jours..."
          python prediction_analyzer.py || true
          echo "✅ Prédictions terminées"
      
      - name: 📄 ÉTAPE 5 - Analyse Fondamentale (Mistral AI)
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          echo "🚀 Analyse fondamentale avec Mistral AI..."
          echo "🤖 Modèle: mistral-large-latest"
          python fundamental_analyzer.py
          echo "✅ Analyse fondamentale terminée"
      
      - name: 📝 ÉTAPE 6 - Génération Rapports (Mistral AI)
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          echo "🚀 Génération rapports avec Mistral AI..."
          python report_generator.py || true
          echo "✅ Rapports générés"
      
      - name: 📰 ÉTAPE 7 - Collecte News & Scoring IA
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "📰 Collecte des news BRVM..."
          python news_collector.py || true
          echo "✅ News pipeline terminé"
  
      - name: 📤 Upload Rapports
        uses: actions/upload-artifact@v4
        with:
          name: rapports-brvm-${{ github.run_number }}
          path: Rapport_*.docx
          retention-days: 90
      
      - name: 📊 Résumé
        if: always()
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📈 BRVM ANALYSIS SUITE V25.0 (Mistral AI)"
          echo "═══════════════════════════════════════════════════════════"
          echo "Date: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Run: ${{ github.run_number }}"
          echo ""
          echo "✅ Pipeline terminé"
          echo "═══════════════════════════════════════════════════════════"
